# Every dependency moves once a week, in the window all of danielbodart's
# repositories share: Sunday 21:23 UTC, two hours before nix-config takes its
# own inputs on the same nixos-26.05. Its glim is a release's tarball, pinned
# by tag (flake.nix), so nothing here is built for it. What moves: every
# flake input, and each tool in mise.toml to the latest patch of its minor
# (a minor moves by hand), and any build.zig.zon dependency to its
# upstream's latest release tag that builds with that Zig
# (scripts/zig-deps.sh; glim has none today).
#
# Nothing is committed unless the new files pass what CI runs, every channel:
# `mise run check`, the tarball built and its units verified, and `./run
# nix`, the flake check with its NixOS VM test of that tarball (which
# stages, and then takes out again, a nix/release.json for it). Then they
# are committed straight to trunk, named by what moved, and if anything in
# mise.toml's RELEASE_PATHS changed since the last release (`mise run
# release-due`: a new Zig, say), CI is dispatched with `release` (a push
# made with GITHUB_TOKEN starts no workflow). A week that moved only
# flake.lock releases nothing: the package is the release's tarball
# whatever nixpkgs is, so it would be the same code under a new version.
name: Weekly update
on:
  schedule:
    - cron: "23 21 * * 0"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
# Shared with anything else that commits to trunk.
concurrency:
  group: update
# bash -eo pipefail for every run step.
defaults:
  run:
    shell: bash
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # run.ts versions the tarball by commit count.
          fetch-depth: 0
      - uses: jdx/mise-action@v5
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: false

      - name: Move everything
        id: update
        run: |
          moved=()

          nix flake update 2>&1 | tee update.log
          mapfile -t inputs < <(grep -oE "Updated input '[^']+'" update.log | cut -d"'" -f2)
          moved+=("${inputs[@]}")

          # Each tool to the latest patch of the minor mise.toml pins.
          while read -r tool pinned; do
            latest=$(mise latest "$tool@${pinned%.*}")
            if [ -n "$latest" ] && [ "$latest" != "$pinned" ] && [ "$(grep -c "\"$pinned\"" mise.toml)" = 1 ]; then
              sed -i "s/\"$pinned\"/\"$latest\"/" mise.toml
              moved+=("$tool $pinned -> $latest")
            fi
          done < <(mise ls --current --local --json | jq -r 'to_entries[] | "\(.key) \(.value[0].requested_version)"')
          mise install

          # build.zig.zon's dependencies, each to its latest tag that builds
          # with that Zig.
          zigdeps=$(mise exec -- scripts/zig-deps.sh)
          if [ -n "$zigdeps" ]; then mapfile -t deps <<<"$zigdeps"; moved+=("${deps[@]}"); fi

          if [ ${#moved[@]} -eq 0 ]; then echo "Nothing moved."; exit 0; fi
          list=$(printf '%s, ' "${moved[@]}")
          echo "moved=${list%, }" >> "$GITHUB_OUTPUT"

      - name: Check every channel
        if: steps.update.outputs.moved
        run: |
          mise install
          mise run check
          mise run dist
          mise run dist-check
          ./run nix

      - name: Commit and push
        if: steps.update.outputs.moved
        env:
          MOVED: ${{ steps.update.outputs.moved }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qm "Weekly update: $MOVED" flake.lock mise.toml build.zig.zon
          git pull -q --rebase origin trunk
          git push -q origin HEAD:trunk

      - name: Release, if a release path moved
        if: steps.update.outputs.moved
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if mise run release-due; then gh workflow run ci.yml --ref trunk -f release=true; fi
