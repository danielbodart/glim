name: CI
on:
  push:
    branches: [trunk]
  # release: publish once the checks pass whatever changed. The weekly update
  # sets it when it moved something the tarball is made of, its push having
  # started nothing.
  workflow_dispatch:
    inputs:
      release:
        type: boolean
        default: false
permissions:
  contents: read
# bash -eo pipefail for every run step.
defaults:
  run:
    shell: bash
jobs:
  # The fast one: shellcheck and the unit tests, with mise's Zig.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # zig, bun, shellcheck and cosign, at the versions mise.toml pins.
      - uses: jdx/mise-action@v5
      - uses: actions/cache@v6
        with:
          path: ~/.cache/zig
          key: zig-${{ hashFiles('build.zig.zon', 'mise.toml') }}
          restore-keys: zig-
      - run: mise run check

  # The release tarball, built by mise as it is released, and unpacked to
  # verify its units against the binary in it.
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # run.ts versions the release by commit count.
          fetch-depth: 0
      - uses: jdx/mise-action@v5
      - uses: actions/cache@v6
        with:
          path: ~/.cache/zig
          key: zig-${{ hashFiles('build.zig.zon', 'mise.toml') }}
          restore-keys: zig-
      - run: mise run dist
      - run: mise run dist-check
      - uses: actions/upload-artifact@v7
        with:
          name: glim-linux-x86_64
          path: dist/

  # The package builds anywhere Nix does; the NixOS module needs a NixOS
  # system, which the flake's check boots in a VM (KVM is on Linux runners).
  # On trunk, glim's own package goes to the danielbodart cache, and nothing
  # else: never the VM test's closure (the free tier is 5 GB).
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Only for bun, which runs run.ts. The flake supplies everything else.
      - uses: jdx/mise-action@v5
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: false
      - uses: cachix/cachix-action@v17
        with:
          name: danielbodart
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true
      - name: Nix
        run: ./run nix
      - name: Push glim's package to Cachix
        if: github.ref == 'refs/heads/trunk'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [ -z "$CACHIX_AUTH_TOKEN" ]; then echo "No CACHIX_AUTH_TOKEN: nothing is pushed."; exit 0; fi
          nix build --no-link --print-out-paths .#glim | cachix push danielbodart

  # A release, when a push to trunk that passed every channel's checks above
  # changed what the tarball is made of: anything in mise.toml's
  # RELEASE_PATHS since the last release tag (`mise run release-due`). The
  # workflows, docs, flake.nix, flake.lock and nix/ alone release nothing. A
  # dispatch with `release` publishes whatever changed. The release is dist/
  # as the dist job built and checked it (the tarball, its .sha256,
  # install.sh and SHA256SUMS), the tarball signed here with cosign (keyless,
  # a sigstore bundle beside it), as capsper's are. The notes are the commits
  # since the last release.
  release:
    needs: [check, dist, nix]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/trunk'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: jdx/mise-action@v5
      - name: Is a release due?
        id: due
        env:
          FORCE: ${{ inputs.release }}
        run: |
          if [ "$FORCE" = true ] || mise run release-due; then due=true; else due=false; fi
          echo "Release due: $due"
          echo "due=$due" >> "$GITHUB_OUTPUT"
      - if: steps.due.outputs.due == 'true'
        uses: actions/download-artifact@v8
        with:
          name: glim-linux-x86_64
          path: dist
      - name: Sign and release
        if: steps.due.outputs.due == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(./run version)
          (cd dist && sha256sum -c SHA256SUMS)
          cosign sign-blob dist/glim-linux-x86_64.tar.gz --bundle dist/glim-linux-x86_64.tar.gz.sigstore.json --yes
          # Trunk-based, no pull requests, so GitHub's PR-based notes would be
          # empty: the commits since the last release instead, or the head
          # commit when there is none.
          PREV="$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)"
          if [ -n "$PREV" ] && git rev-parse -q --verify "refs/tags/$PREV" >/dev/null; then
            git log "$PREV..HEAD" --pretty='- %s (%h)' > notes.md
          else
            { echo 'First automated release.'; echo; git log -1 --pretty='- %s (%h)'; } > notes.md
          fi
          gh release create "v$V" --title "v$V" --notes-file notes.md --target "$GITHUB_SHA" dist/*
