# The toolchain, pinned to the patch, for the release tarball, CI's fast
# check and anyone working on this. The weekly update
# (.github/workflows/update.yml) moves each tool to the latest patch of its
# minor; a minor moves by hand. This Zig builds every glim there is: the Nix
# package is the release tarball, fetched (nix/package.nix), not a second
# build from source.
[tools]
zig = "0.15.2"
bun = "1.3.14"
shellcheck = "0.11.0"
cosign = "3.0.6"

# What a release is made of: the tarball's sources, and flake.nix and
# nix/package.nix and nix/nixos-module.nix, which are how a NixOS host
# pinning a release tag installs that tarball. A change to any of these
# since the last release is released (scripts/release-due.sh); the
# workflows, docs (the README and LICENSE the tarball carries go out with
# the next release) and flake.lock (a consumer follows its own nixpkgs) are
# not, nor is nix/release.json, which a release adds on its tag's own
# commit.
[env]
RELEASE_PATHS = "build.zig build.zig.zon src packaging run.ts mise.toml flake.nix nix/package.nix nix/nixos-module.nix"

[tasks.check]
description = "shellcheck, the release scripts' tests and the unit tests"
depends = ["lint", "scripts-test", "test"]

[tasks.lint]
description = "shellcheck the installer and the scripts"
run = "./run lint"

[tasks.scripts-test]
description = "The release scripts' tests: release.json, and which changes release"
run = ["scripts/release-json-test.sh", "scripts/release-due-test.sh"]

[tasks.test]
description = "The unit tests, the D-Bus client's under a private bus"
run = "./run test"

[tasks.build]
description = "glim, static, for any x86_64 Linux, into zig-out/"
run = "./run build"

[tasks.dist]
description = "The release into dist/: the tarball, its .sha256, install.sh and SHA256SUMS"
run = "./run dist"

[tasks.dist-check]
description = "The tarball, as dist made it, unpacked: the binary says its version and systemd-analyze verifies the units against it"
run = "scripts/dist-check.sh"

# `if mise run release-due; then ...`: CI's release job and the weekly
# update ask it.
[tasks.release-due]
description = "Print true and succeed if anything in RELEASE_PATHS changed since the last release, else print false and fail"
run = "scripts/release-due.sh"
