# The toolchain, pinned to the patch, for the release tarball, CI's fast
# check and anyone working on this. The weekly update
# (.github/workflows/update.yml) moves each tool to the latest patch of its
# minor; a minor moves by hand, with zig_0_NN in nix/package.nix, so the
# tarball and the Nix package are built by the same Zig.
[tools]
zig = "0.15.2"
bun = "1.3.14"
shellcheck = "0.11.0"
cosign = "3.0.6"

# What the release tarball is made of. A change to any of these since the
# last release tag is released (see release-due); the workflows, docs,
# flake.nix, flake.lock and nix/ are not.
[env]
RELEASE_PATHS = "build.zig build.zig.zon src dist run.ts mise.toml"

[tasks.check]
description = "shellcheck and the unit tests"
depends = ["lint", "test"]

[tasks.lint]
description = "shellcheck the installer"
run = "./run lint"

[tasks.test]
description = "The unit tests, the D-Bus client's under a private bus"
run = "./run test"

[tasks.build]
description = "glim, static, for any x86_64 Linux, into zig-out/"
run = "./run build"

[tasks.dist]
description = "The release tarball and its .sha256"
run = "./run dist"

[tasks.dist-check]
description = "The tarball, as dist made it, unpacked: the binary says its version and systemd-analyze verifies the units against it"
run = "scripts/dist-check.sh"

[tasks.release-due]
description = "Print true if anything in RELEASE_PATHS changed since the last release tag, else false"
run = '''
set -f
last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null) || { echo true; exit 0; }
if [ -n "$(git diff --name-only "$last" HEAD -- $RELEASE_PATHS)" ]; then echo true; else echo false; fi
'''
